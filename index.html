<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: black;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Noto Sans SC', sans-serif;
    color: white;
  }

  .title {
    font-size: 32px;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }

  .clock {
    font-size: 24px;
    margin: 10px 0;
    text-align: center;
    width: 60vw;           /* kétszer szélesebb, mint korábban */
    padding: 10px 0;
    border-radius: 8px;
    background-color: rgba(255,255,255,0.1); /* halvány háttér a színes hatás miatt */
    transition: background 0.5s;
  }
</style>
</head>
<body>

<div class="title">El Camino</div>

<div id="bp" class="clock"></div>
<div id="madrid" class="clock"></div>
<div id="lisbon" class="clock"></div>

<script>
const cities = [
  { name: 'Budapest', offset: 1, elementId: 'bp' },
  { name: 'Madrid', offset: 0, elementId: 'madrid' },
  { name: 'Lisbon', offset: 0, elementId: 'lisbon' }
];

function pad(num) {
  return num.toString().padStart(2, '0');
}

function updateClocks() {
  const now = new Date();

  cities.forEach(city => {
    let hours = now.getUTCHours() + city.offset;
    if (hours < 0) hours += 24;
    if (hours >= 24) hours -= 24;

    const minutes = now.getUTCMinutes();
    const seconds = now.getUTCSeconds();

    const display = `${city.name}  ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    const el = document.getElementById(city.elementId);
    el.textContent = display;

    // Mindhárom város sávja kicsit különböző árnyalatú
    el.style.backgroundColor = `hsl(${hours * 15}, 70%, 40%)`;
  });

  setTimeout(updateClocks, 1000);
}

updateClocks();
</script>

</body>
</html>
